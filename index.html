<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Miniature Studio - Professional Booking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#faf7f2}.box{max-width:500px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 30px #0001}
.top{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:9}
.logo{font-weight:900;letter-spacing:1px;font-size:18px}.logo span{color:#ff6b35}
.badge{background:#111;color:#fff;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:800}
.hero{padding:18px 20px;text-align:center;background:linear-gradient(135deg,#fff8f0,#ffe9d6)}
.hero h1{font-size:22px}.hero p{color:#888;font-size:12px;margin-top:6px;line-height:1.4}
.card{margin:12px;border:1px solid #eee;border-radius:18px;padding:16px}
.tt{font-size:11px;color:#999;letter-spacing:1px;font-weight:800;margin-bottom:8px}
.type{border:2px solid #eee;border-radius:16px;padding:14px;text-align:center;cursor:pointer;background:#fff}
.type.on{border-color:#111;background:#111;color:#fff}
.size{border:1.5px solid #eee;border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#fdfbf8}
.size.on{background:#111;color:#fff;border-color:#111}
.in{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-weight:600;background:#fdfbf8}
.btn{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
.btn2{background:#ff6b35}
.priceBox{background:#111;color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;margin:10px 0}
.hide{display:none}
.qr{width:190px;height:190px;margin:10px auto;display:block;border-radius:12px;background:#fff;padding:6px}
</style>
</head>
<body>

<div class="top"><div class="logo">MINI<span>3D</span> STUDIO 🗽</div><div class="badge">sonali-5411@ptyes</div></div>

<p><b>Single</b> 👨‍👧 | <b>Couple</b> 👩‍❤️‍👩 | <b>Family</b> 👨‍👩‍👧‍👦<br>Select Size - Professional 3D</p>
